name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:   # also runs the manual-only jobs (cgo, fuzz, govulncheck, bench)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Pushes and pull requests run the first entry only; a manual run
        # (workflow_dispatch) runs the full matrix.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod pins the minimum Go the library supports; CI runs on the
          # oldest Go release line still receiving security fixes, so that
          # govulncheck sees a patched stdlib (the fixes never land on an
          # end-of-life line). Bump when a new Go release retires this one.
          go-version: '1.26'
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      # Build-only: catches bugs that depend on the width of int (such as a
      # size cap compared in platform int instead of int64).
      - run: GOARCH=386 go build ./...
  # The cloud store backends are nested modules (each with its own go.mod,
  # so their SDKs stay out of the root module graph). `./...` at the root
  # stops at a module boundary, so each needs its own pass. The backends are
  # pure Go over HTTP, so one OS is enough; their offline tests run against
  # an in-process fake, and the integration tests skip without credentials.
  cloud-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: store/*/go.sum
      - run: |
          set -e
          for m in store/s3 store/gcs store/azblob; do
            echo "::group::$m"
            (cd "$m" && go build ./... && go vet ./... && go test -race ./...)
            echo "::endgroup::"
          done
  # cgo exercises the zarrcgo build tag (the cgo-backed blosc codec), which
  # the default `test` matrix above never compiles at all since the tag is
  # opt-in. Linux-only: libblosc-dev is readily apt-installable there.
  cgo:
    if: github.event_name == 'workflow_dispatch'   # manual only: run from the Actions tab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: sudo apt-get update && sudo apt-get install -y libblosc-dev
      - run: CGO_ENABLED=1 go build -tags zarrcgo ./...
      - run: CGO_ENABLED=1 go vet -tags zarrcgo ./...
      - run: CGO_ENABLED=1 go test -tags zarrcgo -race ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: '**/go.sum'
      # golangci-lint-action v8+ is required for golangci-lint v2 (v6 rejects
      # any v2 version string outright).
      - uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint refuses to load a module whose go directive is
          # newer than the Go it was built with, so the pin must be built
          # with go1.26 or later (v2.12.2 is built with go1.26.2);
          # .golangci.yml uses the matching v2 config schema. The nested
          # modules pick up the root .golangci.yml.
          version: v2.12.2
          install-only: true
      - run: |
          set -e
          for m in . store/s3 store/gcs store/azblob; do
            echo "::group::$m"
            (cd "$m" && golangci-lint run)
            echo "::endgroup::"
          done
  # Short-run fuzzing: 20s per target is enough to catch a regression
  # against the checked-in seed corpus without materially slowing CI. Any
  # crasher Go finds is auto-written to testdata/fuzz/<name>/ and becomes a
  # permanent regression test once committed.
  fuzz:
    if: github.event_name == 'workflow_dispatch'   # manual only: run from the Actions tab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go test ./internal/ndcopy/... -run '^$' -fuzz '^FuzzCopy$' -fuzztime 20s
      - run: go test ./codec/sharding/... -run '^$' -fuzz '^FuzzDecodeIndex$' -fuzztime 20s
      - run: go test ./codec/sharding/... -run '^$' -fuzz '^FuzzDecodePartial$' -fuzztime 20s
      # -fuzz is a regexp; FuzzDecodeArray unanchored also matches
      # FuzzDecodeArrayV2, which -fuzz rejects as ambiguous ("matches more
      # than one fuzz test") — anchor both patterns.
      - run: go test ./internal/metadata/... -run '^$' -fuzz '^FuzzDecodeArray$' -fuzztime 20s
      - run: go test ./internal/metadata/... -run '^$' -fuzz '^FuzzDecodeArrayV2$' -fuzztime 20s
  # Known-vulnerability scan of each module's graph and the toolchain's
  # stdlib. Only reports findings reachable from the scanned module's code.
  govulncheck:
    if: github.event_name == 'workflow_dispatch'   # manual only: run from the Actions tab
    strategy:
      fail-fast: false
      matrix:
        module: [., store/s3, store/gcs, store/azblob]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          # The stdlib fixes govulncheck checks for ship in the newest patch
          # release, which the runner image's toolcache can lag behind.
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
  bench:
    if: github.event_name == 'workflow_dispatch'   # manual only: run from the Actions tab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go install golang.org/x/perf/cmd/benchstat@latest
      - run: ./scripts/bench_compare.sh 15
        # 15% slack: GitHub-hosted runners have variable performance.
        # Local pre-merge gate uses the script with a tighter threshold (5-10%).
