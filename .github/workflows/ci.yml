name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Match the version pinned in go.mod. Bump together with that.
          go-version: '1.25'
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
  # cgo exercises the zarrcgo build tag (cgo-backed zstd, blosc codecs),
  # which the default `test` matrix above never compiles at all since the
  # tag is opt-in. Linux-only: libzstd-dev/libblosc-dev are readily
  # apt-installable there.
  cgo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: sudo apt-get update && sudo apt-get install -y libzstd-dev libblosc-dev
      - run: CGO_ENABLED=1 go build -tags zarrcgo ./...
      - run: CGO_ENABLED=1 go vet -tags zarrcgo ./...
      - run: CGO_ENABLED=1 go test -tags zarrcgo -race ./...
  # Build-only: catches the int/int64-width-dependent class of bug (the
  # motivating case was a decoded-size cap check in blosc/zstd that used
  # platform int instead of int64) without needing to execute 32-bit binaries
  # the runner can't run natively.
  build-386:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: GOARCH=386 go build ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@v6
        with:
          # v1.61 (the previous pin) is built with go1.23 and refuses to
          # even load a config for a go1.25 module ("the Go language
          # version (go1.23) used to build golangci-lint is lower than the
          # targeted Go version"). v2.12.2 is built with go1.26 and works;
          # .golangci.yml was migrated to the v2 config schema to match
          # (`golangci-lint migrate`).
          version: v2.12.2
  # Short-run fuzzing: 20s per target is enough to catch a regression
  # against the checked-in seed corpus without materially slowing CI. Any
  # crasher Go finds is auto-written to testdata/fuzz/<name>/ and becomes a
  # permanent regression test once committed.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go test ./internal/ndcopy/... -run '^$' -fuzz '^FuzzCopy$' -fuzztime 20s
      - run: go test ./codec/sharding/... -run '^$' -fuzz '^FuzzDecodeIndex$' -fuzztime 20s
      - run: go test ./codec/sharding/... -run '^$' -fuzz '^FuzzDecodePartial$' -fuzztime 20s
      # -fuzz is a regexp; FuzzDecodeArray unanchored also matches
      # FuzzDecodeArrayV2, which -fuzz rejects as ambiguous ("matches more
      # than one fuzz test") — anchor both patterns.
      - run: go test ./internal/metadata/... -run '^$' -fuzz '^FuzzDecodeArray$' -fuzztime 20s
      - run: go test ./internal/metadata/... -run '^$' -fuzz '^FuzzDecodeArrayV2$' -fuzztime 20s
  # Known-vulnerability scan of the module graph and the toolchain's stdlib.
  # Only reports findings reachable from this module's code.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
  bench:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go install golang.org/x/perf/cmd/benchstat@latest
      - run: ./scripts/bench_compare.sh 15
        # 15% slack: GitHub-hosted runners have variable performance.
        # Local pre-merge gate uses the script with a tighter threshold (5-10%).
