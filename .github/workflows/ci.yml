name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Match the version pinned in go.mod. Bump together with that.
          go-version: '1.25'
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
  # The cloud store backends are nested modules (each with its own go.mod,
  # so their SDKs stay out of the root module graph). `./...` at the root
  # stops at a module boundary, so each needs its own run. The backends are
  # pure Go over HTTP, so one OS is enough; their offline tests run against
  # an in-process fake, and the integration tests skip without credentials.
  cloud-modules:
    strategy:
      fail-fast: false
      matrix:
        module: [store/s3, store/gcs, store/azblob]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
  # cgo exercises the zarrcgo build tag (the cgo-backed blosc codec), which
  # the default `test` matrix above never compiles at all since the tag is
  # opt-in. Linux-only: libblosc-dev is readily apt-installable there.
  cgo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: sudo apt-get update && sudo apt-get install -y libblosc-dev
      - run: CGO_ENABLED=1 go build -tags zarrcgo ./...
      - run: CGO_ENABLED=1 go vet -tags zarrcgo ./...
      - run: CGO_ENABLED=1 go test -tags zarrcgo -race ./...
  # Build-only: catches bugs that depend on the width of int (such as a size
  # cap compared in platform int instead of int64) without needing to
  # execute 32-bit binaries the runner can't run natively.
  build-386:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: GOARCH=386 go build ./...
  lint:
    strategy:
      fail-fast: false
      matrix:
        module: [., store/s3, store/gcs, store/azblob]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          # golangci-lint refuses to load a module whose go directive is
          # newer than the Go it was built with, so the pin must be built
          # with go1.25 or later; .golangci.yml uses the matching v2 config
          # schema. The nested modules pick up the root .golangci.yml.
          version: v2.12.2
          working-directory: ${{ matrix.module }}
  # Short-run fuzzing: 20s per target is enough to catch a regression
  # against the checked-in seed corpus without materially slowing CI. Any
  # crasher Go finds is auto-written to testdata/fuzz/<name>/ and becomes a
  # permanent regression test once committed.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go test ./internal/ndcopy/... -run '^$' -fuzz '^FuzzCopy$' -fuzztime 20s
      - run: go test ./codec/sharding/... -run '^$' -fuzz '^FuzzDecodeIndex$' -fuzztime 20s
      - run: go test ./codec/sharding/... -run '^$' -fuzz '^FuzzDecodePartial$' -fuzztime 20s
      # -fuzz is a regexp; FuzzDecodeArray unanchored also matches
      # FuzzDecodeArrayV2, which -fuzz rejects as ambiguous ("matches more
      # than one fuzz test") — anchor both patterns.
      - run: go test ./internal/metadata/... -run '^$' -fuzz '^FuzzDecodeArray$' -fuzztime 20s
      - run: go test ./internal/metadata/... -run '^$' -fuzz '^FuzzDecodeArrayV2$' -fuzztime 20s
  # Known-vulnerability scan of each module's graph and the toolchain's
  # stdlib. Only reports findings reachable from the scanned module's code.
  govulncheck:
    strategy:
      fail-fast: false
      matrix:
        module: [., store/s3, store/gcs, store/azblob]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
  bench:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go install golang.org/x/perf/cmd/benchstat@latest
      - run: ./scripts/bench_compare.sh 15
        # 15% slack: GitHub-hosted runners have variable performance.
        # Local pre-merge gate uses the script with a tighter threshold (5-10%).
